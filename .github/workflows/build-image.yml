name: Build and Push VM Images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Override image tag (defaults to git tag or SHA)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.vm_type }} image
    runs-on: [self-hosted, kvm]
    strategy:
      max-parallel: 2
      matrix:
        vm_type: [node, orchestrator]
    steps:
      - name: Clean workspace
        run: |
          sudo pkill -f 'qemu.*build-' 2>/dev/null || true
          sudo rm -rf "$GITHUB_WORKSPACE"/.images 2>/dev/null || true

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag_override }}" ]; then
            echo "tag=${{ inputs.tag_override }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Set up bridge network
        run: |
          sudo ip link del tap-build 2>/dev/null || true
          sudo bash host/setup.sh

      - name: Build image
        run: sudo env PATH="/usr/local/go/bin:$PATH" bash host/build-image.sh ${{ matrix.vm_type }}
        timeout-minutes: 30

      - name: Fix permissions
        if: always()
        run: sudo chown -R $(whoami) .images/ 2>/dev/null || true

      - name: Push to OCI registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd host && go build -ldflags "-X main.version=${{ steps.tag.outputs.tag }}" -o boxcutter-host ./cmd/host/
          ./boxcutter-host build-image ${{ matrix.vm_type }} --push-only --tag ${{ steps.tag.outputs.tag }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.vm_type }}-image
          path: .images/${{ matrix.vm_type }}-image.qcow2.zst
          retention-days: 30

  build-golden:
    name: Build golden image
    runs-on: [self-hosted, kvm]
    needs: build
    steps:
      - name: Clean workspace
        run: |
          sudo pkill -f 'qemu.*build-' 2>/dev/null || true
          sudo rm -rf "$GITHUB_WORKSPACE"/.images 2>/dev/null || true

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag_override }}" ]; then
            echo "tag=${{ inputs.tag_override }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Set up bridge network
        run: |
          sudo ip link del tap-build 2>/dev/null || true
          sudo bash host/setup.sh

      - name: Build golden image
        run: |
          # Build the Docker image
          cd node/golden && docker build -t boxcutter-golden .
          # Create ext4 without loop mount (works on unprivileged CI runners)
          WORK=$(mktemp -d)
          truncate -s 4G "$WORK/rootfs.ext4"
          mkfs.ext4 -F -q "$WORK/rootfs.ext4"
          # Export container filesystem and write directly using debugfs/e2cp
          CONTAINER=$(docker create boxcutter-golden /bin/true)
          docker export "$CONTAINER" > "$WORK/rootfs.tar"
          docker rm "$CONTAINER"
          # Use fuse2fs if available, otherwise e2tools
          if command -v fuse2fs >/dev/null 2>&1; then
            mkdir -p "$WORK/mnt"
            fuse2fs -o fakeroot "$WORK/rootfs.ext4" "$WORK/mnt"
            tar xf "$WORK/rootfs.tar" -C "$WORK/mnt"
            fusermount -u "$WORK/mnt"
          else
            # Fallback: use sudo mount (may work on self-hosted runners)
            sudo mkdir -p "$WORK/mnt"
            sudo mount -o loop "$WORK/rootfs.ext4" "$WORK/mnt"
            sudo tar xf "$WORK/rootfs.tar" -C "$WORK/mnt"
            sudo umount "$WORK/mnt"
          fi
          # Install to golden dir
          sudo mkdir -p /var/lib/boxcutter/golden
          HASH=$(sha256sum "$WORK/rootfs.ext4" | cut -c1-12)
          sudo mv "$WORK/rootfs.ext4" "/var/lib/boxcutter/golden/${HASH}.ext4"
          sudo ln -sf "${HASH}.ext4" /var/lib/boxcutter/golden/rootfs.ext4
          echo "$HASH" | sudo tee /var/lib/boxcutter/golden/current-version
          rm -rf "$WORK"
          echo "Golden image built: $HASH"

      - name: Push golden image to OCI registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd host && go build -ldflags "-X main.version=${{ steps.tag.outputs.tag }}" -o boxcutter-host ./cmd/host/
          ./boxcutter-host push-golden --tag ${{ steps.tag.outputs.tag }}

  release-host:
    name: Release host binary
    runs-on: [self-hosted, kvm]
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    steps:
      - name: Clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE"/.images 2>/dev/null || true

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Determine tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build release tarball
        run: make release-host VERSION=${{ steps.tag.outputs.tag }}

      - name: Build deb package
        run: make deb-host VERSION=${{ steps.tag.outputs.tag }}

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          DEB_VER="${TAG#v}"
          # Upload to existing release or create new one
          gh release upload "$TAG" \
            .release/boxcutter-host-${TAG}-linux-amd64.tar.gz \
            .release/boxcutter-host_${DEB_VER}_amd64.deb \
            --clobber 2>/dev/null || \
          gh release create "$TAG" \
            --generate-notes \
            --prerelease \
            .release/boxcutter-host-${TAG}-linux-amd64.tar.gz \
            .release/boxcutter-host_${DEB_VER}_amd64.deb
