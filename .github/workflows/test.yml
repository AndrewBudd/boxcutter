name: Go Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: self-hosted
    strategy:
      matrix:
        module:
          - orchestrator
          - node/agent
          - node/vmid
          - node/proxy
          - host
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test ./... -timeout 120s -v

  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Check all modules build
        run: |
          for mod in orchestrator node/agent node/vmid node/proxy host; do
            echo "=== Building $mod ==="
            (cd "$mod" && go build ./...)
          done

      - name: Vet all modules
        run: |
          for mod in orchestrator node/agent node/vmid node/proxy host; do
            echo "=== Vetting $mod ==="
            (cd "$mod" && go vet ./...)
          done
