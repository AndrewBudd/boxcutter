apiVersion: boxcutter/v1
kind: Team
metadata:
  name: platform-opencode
spec:
  defaults:
    type: qemu
    mode: normal
    tool: opencode
    inference:
      provider: openrouter
      model: qwen/qwen3-coder
      endpoint: https://openrouter.ai/api/v1
      api_key: "${OPENROUTER_API_KEY}"
    repos:
      - AndrewBudd/boxcutter
  agents:
    - name: dev-worker
      replicas: 2
      ram: 4G
      vcpu: 2
      description: "Developer - implements features and fixes"
    - name: eng-manager
      replicas: 1
      ram: 4G
      vcpu: 2
      description: "Engineering manager - reviews PRs, coordinates workers"
    - name: product-manager
      replicas: 1
      ram: 4G
      vcpu: 2
      description: "Product manager - specs, design, prioritization"
