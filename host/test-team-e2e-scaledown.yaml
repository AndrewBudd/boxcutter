apiVersion: boxcutter/v1
kind: Team
metadata:
  name: test-team
  labels:
    project: boxcutter
    test: e2e
spec:
  defaults:
    type: firecracker
    ram: 4G
    vcpu: 2
    mode: normal
    repos:
      - AndrewBudd/boxcutter

  agents:
    - name: lead
      ram: 4G
      vcpu: 2
      persona:
        role: test-lead
        claude_md: .claude/personas/eng-manager.md
        instructions: |
          You are the test lead. Respond to any message with "LEAD READY".
      tapegun:
        - guest
        - host

    - name: worker
      replicas: 1
      persona:
        role: test-worker
        claude_md: .claude/personas/developer.md
        instructions: |
          You are a test worker. Respond to any message with "WORKER READY".
